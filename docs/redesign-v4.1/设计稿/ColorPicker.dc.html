<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>取色浮层</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.lbl{color:#5B574F;font-size:12px}
.in{height:26px;border:1px solid #CFC6B5;border-radius:4px;background:#FBF9F4;padding:0 6px;font:inherit;color:inherit;box-sizing:border-box}
.btn{height:26px;padding:0 10px;border:1px solid #CFC6B5;border-radius:4px;background:#FBF9F4;font:inherit;font-size:12px;color:#1E1D1A;cursor:pointer}
.btn.pri{background:#1E1D1A;color:#F6F2EA;border-color:#1E1D1A}
.pop{width:252px;background:#FBF9F4;border:1px solid #CFC6B5;border-radius:6px;box-shadow:0 10px 28px rgba(30,29,26,.18);padding:10px 12px 12px;box-sizing:border-box}
.cmp{display:flex;align-items:center;gap:6px;font-size:12px;color:#5B574F;margin-bottom:8px}
.cmp i{display:block;width:26px;height:18px;border-radius:3px;border:1px solid rgba(0,0,0,.15)}
.cmp b{font-family:Consolas,monospace;font-weight:400;color:#1E1D1A;margin-left:auto}
.pt{font-size:12px;color:#5B574F;margin:8px 0 5px}
.cg{display:grid;grid-template-columns:repeat(10,18px);gap:3px 4px}
.cg button{width:18px;height:18px;border:1px solid rgba(0,0,0,.12);padding:0;cursor:pointer;border-radius:2px}
.cg button:hover{outline:1px solid #1E1D1A}
.cg button.on{box-shadow:0 0 0 2px #FBF9F4,0 0 0 3px #1E1D1A}
.pf{display:flex;align-items:center;gap:6px;margin-top:10px}
.more{background:none;border:0;padding:0;font:inherit;font-size:12px;color:#2C4A66;cursor:pointer;margin-left:auto}
.sw{width:30px;height:24px;border-radius:4px;border:1px solid rgba(0,0,0,.18);padding:0;cursor:pointer}
input[type=range]{width:100%;accent-color:#2C4A66}
</style>
</helmet>
<div style="width: 760px; height: 560px; box-sizing: border-box; padding: 24px 32px; background: #ECE6DB; font-family: 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif; color: #1E1D1A; font-size: 13px; display: flex; gap: 40px">
<div style="display: flex; flex-direction: column; gap: 10px">
<div class="lbl">点一下只是试色：图上立刻变，浮层不关；点“确定”才算数，“取消”恢复原来的</div>
<div style="display: flex; align-items: center; gap: 10px"><span>点位编号 · 颜色</span><button type="button" class="sw" style="{{ curStyle }}" aria-label="当前颜色"></button><span style="{{ sampleStyle }}">Cam1</span></div>
<div class="pop" role="dialog" aria-label="选择颜色">
<div class="cmp"><span>原来</span><i style="{{ oldStyle }}"></i><span>现在</span><i style="{{ curStyle }}"></i><b>{{ cur }}</b></div>
<div class="pt" style="margin-top: 0">主题颜色</div>
<div class="cg"><sc-for list="{{ base }}" as="p" hint-placeholder-count="10"><button type="button" class="{{ p.cls }}" style="{{ p.style }}" aria-label="{{ p.name }}" title="{{ p.name }}" onClick="{{ p.pick }}"></button></sc-for></div>
<div class="cg" style="margin-top: 6px"><sc-for list="{{ tints }}" as="p" hint-placeholder-count="50"><button type="button" class="{{ p.cls }}" style="{{ p.style }}" aria-label="{{ p.name }}" title="{{ p.name }}" onClick="{{ p.pick }}"></button></sc-for></div>
<div class="pt">最近使用</div>
<div class="cg"><sc-for list="{{ recent }}" as="p" hint-placeholder-count="6"><button type="button" class="{{ p.cls }}" style="{{ p.style }}" aria-label="{{ p.name }}" title="{{ p.name }}" onClick="{{ p.pick }}"></button></sc-for></div>
<div class="pf"><input class="in" style="width: 84px; font-family: Consolas, monospace" value="{{ cur }}" aria-label="色值" onChange="{{ setHex }}"><button type="button" class="btn" style="width: 49px; height: 25px">吸管</button><button type="button" class="more" style="white-space: nowrap" onClick="{{ toggleMore }}">{{ moreText }}</button></div>
<div class="pf" style="justify-content: flex-end"><button type="button" class="btn" onClick="{{ cancel }}">取消</button><button type="button" class="btn pri" onClick="{{ ok }}">确定</button></div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div class="lbl">每列是一个主色：最上面是主色，往下依次加白（淡 80%、60%、40%）、加黑（深 25%、50%）。“最近使用”在点“确定”时才更新，点的时候色块不会跳位置。</div>
<sc-if value="{{ more }}" hint-placeholder-val="{{ true }}">
<div class="pop" style="width: 268px">
<div class="lbl" style="margin-bottom: 6px">更多颜色</div>
<div style="{{ svStyle }}" aria-hidden="true"><span style="{{ dotStyle }}"></span></div>
<div class="lbl" style="margin: 10px 0 4px">色相</div>
<input type="range" min="0" max="359" value="{{ hue }}" aria-label="色相" onChange="{{ setHue }}">
<div style="display: flex; gap: 6px; align-items: center; margin-top: 10px">
<span style="{{ hueSwatch }}"></span>
<input class="in" style="width: 84px; font-family: Consolas, monospace" value="{{ hueHex }}" aria-label="色值">
<span style="flex: 1"></span>
<button type="button" class="btn" onClick="{{ useHue }}">试这个颜色</button>
</div>
</div>
</sc-if>
<div class="lbl" style="line-height: 1.6">全软件只用这一个取色浮层：文字、箭头、红圈、高亮都一样，不再弹出系统自带的取色窗口。</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":560}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { orig: '#1E2A3A', cur: '#1E2A3A', recent: ['#C0392B', '#1E2A3A', '#0E6E5C', '#283593'], hue: 200, more: true };
  }
  renderVals() {
    const s = this.state;
    const BASE = [['#262626', '黑'], ['#E53935', '红'], ['#F57C00', '橙'], ['#FBC02D', '黄'], ['#43A047', '绿'], ['#00897B', '青'], ['#1E88E5', '蓝'], ['#3949AB', '靛'], ['#8E24AA', '紫'], ['#6D4C41', '棕']];
    const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
    const hex = (c) => '#' + c.map((v) => Math.round(v).toString(16).padStart(2, '0')).join('').toUpperCase();
    const tint = (h, p) => hex(rgb(h).map((v) => v + (255 - v) * p));
    const shade = (h, p) => hex(rgb(h).map((v) => v * (1 - p)));
    const VARIANTS = [['淡 80%', (h) => tint(h, 0.8)], ['淡 60%', (h) => tint(h, 0.6)], ['淡 40%', (h) => tint(h, 0.4)], ['深 25%', (h) => shade(h, 0.25)], ['深 50%', (h) => shade(h, 0.5)]];
    const TINTS = [];
    VARIANTS.forEach(([vn, fn]) => BASE.forEach(([c, n]) => TINTS.push([fn(c), n + ' · ' + vn])));
    const pick = (c) => this.setState({ cur: c });
    const cells = (list) => list.map(([c, name]) => ({ name: name + ' ' + c, cls: c.toUpperCase() === s.cur.toUpperCase() ? 'on' : '', style: 'background:' + c, pick: () => pick(c) }));
    const hsl = (h) => {
      const f = (n) => { const k = (n + h / 30) % 12; const a = 0.75 * Math.min(0.45, 1 - 0.45); const v = 0.45 - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); return Math.round(v * 255).toString(16).padStart(2, '0'); };
      return ('#' + f(0) + f(8) + f(4)).toUpperCase();
    };
    const hueHex = hsl(s.hue);
    return {
      cur: s.cur,
      curStyle: 'background:' + s.cur,
      oldStyle: 'background:' + s.orig,
      sampleStyle: 'font-weight:700;font-size:15px;color:' + s.cur,
      base: cells(BASE), tints: cells(TINTS), recent: cells(s.recent.map((c) => [c, '最近使用'])),
      setHex: (e) => { const v = e.target.value.trim(); if (/^#[0-9a-fA-F]{6}$/.test(v)) pick(v.toUpperCase()); },
      ok: () => this.setState({ orig: s.cur, recent: [s.cur].concat(s.recent.filter((x) => x !== s.cur)).slice(0, 10) }),
      cancel: () => this.setState({ cur: s.orig }),
      more: s.more,
      moreText: s.more ? '收起更多颜色' : '更多颜色…',
      toggleMore: () => this.setState({ more: !s.more }),
      hue: s.hue,
      setHue: (e) => this.setState({ hue: Number(e.target.value) }),
      svStyle: 'position:relative;height:130px;border-radius:4px;background:linear-gradient(to top,#000,rgba(0,0,0,0)),linear-gradient(to right,#fff,hsl(' + s.hue + ',100%,50%))',
      dotStyle: 'position:absolute;left:72%;top:30%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.4)',
      hueHex,
      hueSwatch: 'display:inline-block;width:30px;height:24px;border-radius:4px;border:1px solid rgba(0,0,0,.18);background:' + hueHex,
      useHue: () => pick(hueHex)
    };
  }
}
</script>
</body>
</html>
